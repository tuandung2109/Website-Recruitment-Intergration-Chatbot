version: '3.8'

# Production Docker Compose file sử dụng images từ Docker Hub
services:
  # Backend NodeJS
  backend:
    image: tthanhhh/recuitment_website_intergrate_ai-backend:${IMAGE_TAG:-latest}
    container_name: recruitment_backend_prod
    environment:
      NODE_ENV: production
      # Supabase Configuration
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3001
      CORS_ORIGIN: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "3001:3001"
    networks:
      - recruitment_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # AI Chatbot Service (Python/Flask)
  ai_service:
    image: tthanhhh/recuitment_website_intergrate_ai-ai:${IMAGE_TAG:-latest}
    container_name: recruitment_ai_prod
    environment:
      FLASK_ENV: production
      # Supabase Configuration
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      DATABASE_URL: ${DATABASE_URL}
      DOCKER_ENV: "true"
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-hf.co/unsloth/Qwen3-4B-Instruct-2507-GGUF:Q4_K_M}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PORT: 5000
    ports:
      - "5000:5000"
    networks:
      - recruitment_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend ReactJS
  frontend:
    image: tthanhhh/recuitment_website_intergrate_ai-frontend:${IMAGE_TAG:-latest}
    container_name: recruitment_frontend_prod
    environment:
      REACT_APP_API_URL: ${BACKEND_URL:-http://localhost:3001}
      REACT_APP_AI_SERVICE_URL: ${AI_SERVICE_URL:-http://localhost:5000}
      REACT_APP_SUPABASE_URL: ${SUPABASE_URL}
      REACT_APP_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
      ai_service:
        condition: service_healthy
    networks:
      - recruitment_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Ollama cho Local LLM (Optional - có thể chạy trên host)
  ollama:
    image: ollama/ollama:latest
    container_name: recruitment_ollama_prod
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - recruitment_network
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: recruitment_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./Docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      ai_service:
        condition: service_healthy
    networks:
      - recruitment_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ollama_data:
    driver: local

networks:
  recruitment_network:
    driver: bridge
